<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Chris Koon's Home</title>

  <meta name="description" content="Chris Koon's personal website">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Chris Koon's Home">

  <meta property="og:url" content="https://www.kitkoon.com/">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Chris Koon's Home">
  <meta name="twitter:description" content="Chris Koon's personal website">
  <meta name="twitter:image" content="https://github.com/ChrisWK51.png">

  <link rel="canonical" href="https://www.kitkoon.com/">

  <script>
    (() => {
      const target = "https://www.kitkoon.com";
      const oldBase = "/ChrisWK51";

      let path = window.location.pathname;

      if (path === oldBase) {
        path = "/";
      } else if (path.startsWith(oldBase + "/")) {
        path = path.slice(oldBase.length);
      }

      window.location.replace(
        target + path + window.location.search + window.location.hash
      );
    })();
  </script>
</head>

<body>
  <p>
    Redirecting to
    <a href="https://www.kitkoon.com/">www.kitkoon.com</a>...
  </p>
</body>
