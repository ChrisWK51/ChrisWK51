baseURL = "https://www.kitkoon.com/"
theme = "DoIt"
title = "Kit Koon's Home"
defaultContentLanguage = "en"
locale = "en"
hasCJKLanguage = false

enableRobotsTXT = true
enableGitInfo = true
enableEmoji = true

# Keep existing post URLs, including /protfolio/.
[permalinks]
  posts = ":contentbasename"
  projects = ":contentbasename"

[pagination]
  disableAliases = false
  pagerSize = 10
  path = "page"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    title = "About me"
    weight = 1
  [[menu.main]]
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    title = "All posts, newest first"
    weight = 2
  [[menu.main]]
    identifier = "project"
    name = "Projects"
    url = "/projects/"
    title = "Selected projects and earlier work"
    weight = 3
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 4

[params]
  defaultTheme = "auto"
  mainSections = ["posts"]
  dateFormat = "2006-01-02"
  title = "Kit Koon's personal page"
  description = "Projects and development notes from Kit Koon, a full-stack developer in Hong Kong."
  images = ["https://github.com/ChrisWK51.png"]

  [params.author]
    name = "Kit Koon"
    email = "contact@kitkoon.com"
    link = "/about/"

  [params.header]
    themeChangeMode = "switch"
    [params.header.title]
      name = "Kit Koon's Blog"
      pre = '<svg class="raccoon-logo" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true" focusable="false"><use href="/images/raccoon.svg#raccoon"></use></svg>'
      typeit = false

  [params.footer]
    enable = true
    hugo = true
    copyright = true
    author = true
    since = 2025
    license = '<a rel="license external nofollow noopener noreferrer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

  [params.section]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.list]
    paginate = 20
    dateFormat = "01-02"
    rss = 10

  [params.app]
    title = "Kit Koon's Blog"
    svgFavicon = "/favicon.svg"
    iconColor = "#252627"
    themeColor = "#ffffff"
    tileColor = "#da532c"

  # Keep remote images as URLs so builds do not depend on external image hosts.
  [params.image]
    cacheRemote = false
    optimise = true

  [params.search]
    enable = true
    type = "fuse"
    contentLength = 4000
    maxResultLength = 10
    snippetLength = 30
    highlightTag = "em"
    absoluteURL = false
    [params.search.fuse]
      ignoreLocation = true
      threshold = 0.3
      minMatchCharLength = 2

  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      avatarURL = "https://github.com/ChrisWK51.png"
      title = "Kit Koon"
      subtitle = "Full-stack developer in Hong Kong"
      typeit = true
      social = true
    [params.home.posts]
      enable = true
      paginate = 6

  [params.social]
    GitHub = "ChrisWK51"
    Linkedin = "koonchris"
    Discord = "924571292244525057"
    Email = "contact@kitkoon.com"

  [params.page]
    hiddenFromHomePage = false
    hiddenFromSearch = false
    lightgallery = false
    ruby = true
    fraction = true
    linkToMarkdown = false
    rssFullText = false
    enableLastMod = true
    enableWordCount = true
    enableReadingTime = true

    [params.page.toc]
      enable = true
      keepStatic = false
      auto = true

    [params.page.math]
      enable = true
      copyTex = true
      mhchem = true

    [params.page.code]
      maxShownLines = 50
      lineNos = true
      header = true

    [params.page.share]
      enable = true
      Twitter = true
      Facebook = true
      Line = true
      Telegram = true

    [params.page.comment]
      enable = true
      [params.page.comment.utterances]
        enable = true
        repo = "ChrisWK51/ChrisWK51"
        issueTerm = "pathname"
        lightTheme = "github-light"
        darkTheme = "github-dark"

  [params.typeit]
    speed = 100
    cursorSpeed = 1000
    cursorChar = "|"
    duration = -1

  [params.cookieconsent]
    enable = true

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# JSON is the Fuse.js search index. Raw Markdown output is not used.
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

[caches.images]
  dir = ":cacheDir/images"
